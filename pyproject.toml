[project]
name = "realmai-engine"
version = "0.1.0"
description = "An AI-powered RPG Game Master Discord bot — a deterministic Python engine arbitrates D&D-style mechanics while local LLMs (Ollama) handle narration."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CocoLng" }]
keywords = [
    "discord-bot",
    "rpg",
    "game-master",
    "dungeons-and-dragons",
    "dnd-5e",
    "llm",
    "ollama",
    "ai",
    "pydantic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Games/Entertainment :: Role-Playing",
]
dependencies = [
    "chromadb>=1.5.5",
    "discord-py>=2.7.1",
    "httpx>=0.27.0",
    "pydantic>=2,<3",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",
]

[project.urls]
Homepage = "https://github.com/CocoLng/RealmAI-Engine"
Repository = "https://github.com/CocoLng/RealmAI-Engine"
Issues = "https://github.com/CocoLng/RealmAI-Engine/issues"

[dependency-groups]
dev = [
    "mcp>=1.27.0",
    "mypy>=1.20.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.36.0",
    "ruff>=0.15.9",
]

[tool.mypy]
python_version = "3.12"
files = ["engine", "ai", "world", "memory", "db", "bot", "tests"]
# Correctness checks worth failing the build over. Deliberately not
# `strict = true`: the gate has to be green today so it can catch
# regressions, rather than being permanently red and ignored.
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

# Tests are still type-checked when imported by production modules, but
# their own bodies are exempt: fakes, monkeypatched attributes and
# half-built Discord objects are the point of a test double, and pytest is
# the gate that actually proves them. Listing the ~30 error codes that
# implies would be noise nobody maintains.
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# discord.py's documented idiom for dynamic components is to build a
# Select/Button and assign its ``callback`` attribute. mypy reads that as
# overwriting a method; subclassing every component purely to satisfy it
# would be a large, behaviour-risking refactor for no runtime benefit.
[[tool.mypy.overrides]]
module = ["bot.views.*", "bot.cogs.test_bridge"]
disable_error_code = ["method-assign"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: fast isolated unit tests",
    "integration: tests that hit the DB or multiple modules",
    "scenario: end-to-end scenarios via ScenarioRunner",
    "slow: tests taking >1s",
]
filterwarnings = [
    "ignore::DeprecationWarning:discord.*",
]
