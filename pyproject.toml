[project]
name = "realmai-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.5",
    "discord-py>=2.7.1",
    "httpx>=0.27.0",
    "pydantic>=2,<3",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "mcp>=1.27.0",
    "mypy>=1.20.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.36.0",
    "ruff>=0.15.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: fast isolated unit tests",
    "integration: tests that hit the DB or multiple modules",
    "scenario: end-to-end scenarios via ScenarioRunner",
    "slow: tests taking >1s",
]
filterwarnings = [
    "ignore::DeprecationWarning:discord.*",
]
